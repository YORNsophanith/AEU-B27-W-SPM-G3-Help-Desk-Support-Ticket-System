    /* ======================================================================
       REPORTS & KPI
       ====================================================================== */
    function Reports({ tickets, users }) {
      const [type, setType] = useState("Ticket Summary");
      const total = tickets.length;
      const resolved = tickets.filter((t) => ["Resolved", "Closed"].includes(t.status)).length;
      const reopened = tickets.filter((t) => t.status === "Reopened").length;
      const resRate = total ? Math.round((resolved / total) * 100) : 0;
      const withResolveSla = tickets.filter((t) => t.resolvedAt);
      const withinSla = withResolveSla.filter((t) => t.resolvedAt <= t.slaResolveDeadline).length;
      const slaCompliance = withResolveSla.length ? Math.round((withinSla / withResolveSla.length) * 100) : 0;
      const reopenRate = resolved ? Math.round((reopened / resolved) * 100) : 0;
      const rated = tickets.filter((t) => t.rating);
      const avgRating = rated.length ? (rated.reduce((a, t) => a + t.rating, 0) / rated.length).toFixed(1) : "—";

      const byCategory = INITIAL_CATEGORIES.map((c) => ({ name: c.name, count: tickets.filter((t) => t.category === c.name).length }));
      const agentStats = users.filter((u) => u.role === "Agent").map((a) => {
        const assigned = tickets.filter((t) => t.assignee === a.id);
        const res = assigned.filter((t) => ["Resolved", "Closed"].includes(t.status));
        const responded = assigned.filter((t) => t.firstResponseAt);
        const avgResp = responded.length ? Math.round(responded.reduce((sum, t) => sum + (t.firstResponseAt - t.createdAt), 0) / responded.length / mins(1)) : null;
        return { ...a, assigned: assigned.length, resolved: res.length, avgResp };
      });

      return (
        <div>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 18, flexWrap: "wrap", gap: 10 }}>
            <div>
              <h1 style={{ fontFamily: FONT_DISPLAY, fontSize: 24, fontWeight: 600, margin: 0, color: COLORS.ink }}>Reports &amp; KPI Dashboard</h1>
              <p style={{ color: COLORS.muted, fontSize: 13.5, margin: "4px 0 0" }}>Overall Help Desk performance summary.</p>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <select value={type} onChange={(e) => setType(e.target.value)} style={selectSm}>
                {["Ticket Summary", "SLA Report", "Agent Performance", "Category Report", "Satisfaction Report"].map((t) => <option key={t}>{t}</option>)}
              </select>
              <Button size="sm" variant="secondary" icon={Download}>Export PDF/Excel</Button>
            </div>
          </div>

          <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 18 }}>
            <KPICard label="Resolution rate" value={`${resRate}%`} icon={TrendingUp} color={COLORS.green} bg={COLORS.greenSoft} />
            <KPICard label="SLA compliance" value={`${slaCompliance}%`} icon={ShieldCheck} color={COLORS.blue} bg={COLORS.blueSoft} />
            <KPICard label="Reopen rate" value={`${reopenRate}%`} icon={RotateCcw} color={COLORS.amber} bg={COLORS.amberSoft} />
            <KPICard label="Avg. satisfaction" value={avgRating === "—" ? avgRating : `${avgRating}★`} icon={Star} color={COLORS.violet} bg={COLORS.violetSoft} />
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }} className="hd-dash-grid">
            <Card style={{ padding: 18 }}>
              <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 14.5, marginBottom: 14, color: COLORS.ink }}>Tickets by category</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {byCategory.map((c) => (
                  <div key={c.name}>
                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, marginBottom: 3 }}>
                      <span style={{ color: COLORS.inkSoft }}>{c.name}</span>
                      <span style={{ fontFamily: FONT_MONO, color: COLORS.ink, fontWeight: 600 }}>{c.count}</span>
                    </div>
                    <div style={{ height: 6, borderRadius: 4, background: COLORS.bg, overflow: "hidden" }}>
                      <div style={{ height: "100%", width: `${total ? (c.count / total) * 100 : 0}%`, background: COLORS.primary }} />
                    </div>
                  </div>
                ))}
              </div>
            </Card>

            <Card style={{ padding: 18 }}>
              <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 14.5, marginBottom: 14, color: COLORS.ink }}>Agent performance</div>
              <table style={{ width: "100%", borderCollapse: "collapse" }}>
                <thead>
                  <tr style={{ textAlign: "left" }}>
                    {["Agent", "Assigned", "Resolved", "Avg. response"].map((h) => (
                      <th key={h} style={{ fontSize: 10.5, color: COLORS.muted, fontWeight: 700, textTransform: "uppercase", paddingBottom: 8 }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {agentStats.map((a) => (
                    <tr key={a.id} style={{ borderTop: `1px solid ${COLORS.line}` }}>
                      <td style={{ padding: "8px 0", fontSize: 12.5, color: COLORS.ink, display: "flex", alignItems: "center", gap: 7 }}><Avatar user={a} size={22} />{a.name.split(" ")[0]}</td>
                      <td style={{ fontFamily: FONT_MONO, fontSize: 12.5, color: COLORS.inkSoft }}>{a.assigned}</td>
                      <td style={{ fontFamily: FONT_MONO, fontSize: 12.5, color: COLORS.inkSoft }}>{a.resolved}</td>
                      <td style={{ fontFamily: FONT_MONO, fontSize: 12.5, color: COLORS.inkSoft }}>{a.avgResp != null ? `${a.avgResp}m` : "—"}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </Card>
          </div>

          <Card style={{ padding: 18, marginTop: 16 }}>
            <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 13, marginBottom: 6, color: COLORS.ink }}>Formulas used</div>
            <div style={{ fontFamily: FONT_MONO, fontSize: 11.5, color: COLORS.muted, lineHeight: 2 }}>
              Resolution Rate = Resolved ÷ Total × 100<br />
              SLA Compliance = Resolved Within SLA ÷ Resolved × 100<br />
              Reopen Rate = Reopened ÷ Resolved × 100
            </div>
          </Card>
        </div>
      );
    }

    /* ======================================================================
       PROFILE
       ====================================================================== */
    function Profile({ user, onUpdate }) {
      const [f, setF] = useState({ name: user.name, email: user.email, dept: user.dept || "", position: user.position || "" });
      const [editing, setEditing] = useState(false);
      const [saved, setSaved] = useState(false);
      const [pwForm, setPwForm] = useState({ current: "", next: "", confirm: "" });
      const [pwEditing, setPwEditing] = useState(false);
      const [pwError, setPwError] = useState("");
      const [pwSaved, setPwSaved] = useState(false);

      function save() {
        onUpdate(f);
        setEditing(false); setSaved(true);
        setTimeout(() => setSaved(false), 2200);
      }

      function savePassword() {
        if (pwForm.current !== user.password) { setPwError("Current password is incorrect."); return; }
        if (!pwForm.next.trim()) { setPwError("Enter a new password."); return; }
        if (pwForm.next !== pwForm.confirm) { setPwError("New passwords don't match."); return; }
        onUpdate({ password: pwForm.next });
        setPwError(""); setPwEditing(false); setPwSaved(true);
        setPwForm({ current: "", next: "", confirm: "" });
        setTimeout(() => setPwSaved(false), 2200);
      }

      return (
        <div style={{ maxWidth: 520 }}>
          <h1 style={{ fontFamily: FONT_DISPLAY, fontSize: 24, fontWeight: 600, margin: "0 0 18px", color: COLORS.ink }}>My Profile</h1>
          <Card style={{ padding: 22, marginBottom: 16 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 20 }}>
              <Avatar user={user} size={56} />
              <div>
                <div style={{ fontFamily: FONT_DISPLAY, fontSize: 17, fontWeight: 600, color: COLORS.ink }}>{user.name}</div>
                <Badge color={COLORS.primary} bg={COLORS.primarySoft}>{user.role}</Badge>
              </div>
            </div>
            {editing ? (
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <Input label="Full name" value={f.name} onChange={(e) => setF({ ...f, name: e.target.value })} />
                <Input label="Email" value={f.email} onChange={(e) => setF({ ...f, email: e.target.value })} />
                <Input label="Department" value={f.dept} onChange={(e) => setF({ ...f, dept: e.target.value })} />
                <Input label="Position" value={f.position} onChange={(e) => setF({ ...f, position: e.target.value })} />
                <div style={{ display: "flex", gap: 8, justifyContent: "flex-end", marginTop: 4 }}>
                  <Button variant="secondary" onClick={() => setEditing(false)}>Cancel</Button>
                  <Button onClick={save}>Save changes</Button>
                </div>
              </div>
            ) : (
              <div>
                <DetailRow label="Full name" value={user.name} />
                <DetailRow label="Email" value={user.email} />
                <DetailRow label="Department" value={user.dept || "—"} />
                <DetailRow label="Position" value={user.position || "—"} />
                <DetailRow label="Account status" value={<Badge color={COLORS.green} bg={COLORS.greenSoft}>{user.status}</Badge>} />
                <Button style={{ marginTop: 14 }} variant="secondary" onClick={() => setEditing(true)}>Edit profile</Button>
                {saved && <span style={{ marginLeft: 10, fontSize: 12, color: COLORS.green, fontWeight: 600 }}><CheckCircle2 size={13} style={{ verticalAlign: -2, marginRight: 3 }} />Profile updated</span>}
              </div>
            )}
          </Card>

          <Card style={{ padding: 22 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 16 }}>
              <KeyRound size={17} color={COLORS.ink} />
              <div style={{ fontFamily: FONT_DISPLAY, fontSize: 15, fontWeight: 600, color: COLORS.ink }}>Password</div>
            </div>
            {pwEditing ? (
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <Input label="Current password" type="password" value={pwForm.current} onChange={(e) => setPwForm({ ...pwForm, current: e.target.value })} />
                <Input label="New password" type="password" value={pwForm.next} onChange={(e) => setPwForm({ ...pwForm, next: e.target.value })} />
                <Input label="Confirm new password" type="password" value={pwForm.confirm} onChange={(e) => setPwForm({ ...pwForm, confirm: e.target.value })} />
                {pwError && <FieldError text={pwError} />}
                <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
                  <Button variant="secondary" onClick={() => { setPwEditing(false); setPwError(""); setPwForm({ current: "", next: "", confirm: "" }); }}>Cancel</Button>
                  <Button onClick={savePassword}>Update password</Button>
                </div>
              </div>
            ) : (
              <div>
                <DetailRow label="Current password" value={<span style={{ fontFamily: FONT_MONO }}>{user.password}</span>} />
                <Button style={{ marginTop: 14 }} variant="secondary" onClick={() => setPwEditing(true)}>Change password</Button>
                {pwSaved && <span style={{ marginLeft: 10, fontSize: 12, color: COLORS.green, fontWeight: 600 }}><CheckCircle2 size={13} style={{ verticalAlign: -2, marginRight: 3 }} />Password updated</span>}
              </div>
            )}
          </Card>
        </div>
      );
    }

    /* ======================================================================
       ROOT APP
       ====================================================================== */
    function App() {
      const [users, setUsers] = useState(INITIAL_USERS);
      const [tickets, setTickets] = useState(INITIAL_TICKETS);
      const [categories, setCategories] = useState(INITIAL_CATEGORIES);
      const [slaRules, setSlaRules] = useState(INITIAL_SLA_RULES);
      const [kb, setKb] = useState(INITIAL_KB);
      const [notifications, setNotifications] = useState(INITIAL_NOTIFICATIONS);

      const [currentUser, setCurrentUser] = useState(null);
      const [view, setView] = useState("dashboard");
      const [activeTicketId, setActiveTicketId] = useState(null);
      const [showCreate, setShowCreate] = useState(false);
      const [mobileOpen, setMobileOpen] = useState(false);
      const seqRef = useRef(5);

      const unread = currentUser ? notifications.filter((n) => n.to === currentUser.id && !n.read).length : 0;

      function handleLogin(user) { setCurrentUser(user); setView("dashboard"); }
      function handleLogout() { setCurrentUser(null); setActiveTicketId(null); setView("dashboard"); }

      function updateTicket(id, patch) {
        setTickets((ts) => ts.map((t) => (t.id === id ? { ...t, ...patch } : t)));
      }

      function createTicket({ subject, description, category, priority, attachment }) {
        seqRef.current += 1;
        const number = `HD-2026-${String(seqRef.current).padStart(4, "0")}`;
        const t = makeTicket({
          id: "t" + Date.now(), number, subject, description, category, priority, status: "New",
          requester: currentUser.id, createdAt: Date.now(), attachments: attachment ? [attachment] : [],
        });
        setTickets((ts) => [t, ...ts]);
        setNotifications((ns) => [{ id: "n" + Date.now(), to: users.find((u) => u.role === "Team Leader")?.id, text: `New ticket ${number} submitted: ${subject}`, read: false, ts: Date.now() }, ...ns]);
        setShowCreate(false);
        setActiveTicketId(t.id);
        setView("tickets");
      }

      function openTicket(id) { setActiveTicketId(id); setView("tickets"); }
      function updateProfile(patch) { setCurrentUser((u) => ({ ...u, ...patch })); setUsers((us) => us.map((u) => (u.id === currentUser.id ? { ...u, ...patch } : u))); }

      if (!currentUser) {
        return <LoginScreen users={users} onLogin={handleLogin} />;
      }

      const activeTicket = tickets.find((t) => t.id === activeTicketId);

      let content;
      if (view === "dashboard") content = <Dashboard user={currentUser} tickets={tickets} users={users} openTicket={openTicket} setView={setView} />;
      else if (view === "tickets" && activeTicket) content = <TicketDetail ticket={activeTicket} users={users} categories={categories} currentUser={currentUser} onBack={() => setActiveTicketId(null)} onUpdate={updateTicket} />;
      else if (view === "tickets") content = <TicketList user={currentUser} tickets={tickets} categories={categories} users={users} openTicket={openTicket} onNewTicket={() => setShowCreate(true)} />;
      else if (view === "kb") content = <KnowledgeBase kb={kb} setKb={setKb} categories={categories} canManage={["Agent", "Team Leader", "Administrator"].includes(currentUser.role)} />;
      else if (view === "notifications") content = <Notifications notifications={notifications} setNotifications={setNotifications} currentUser={currentUser} />;
      else if (view === "reports") content = <Reports tickets={tickets} users={users} />;
      else if (view === "users") content = <UserManagement users={users} setUsers={setUsers} />;
      else if (view === "categories") content = <CategoryManagement categories={categories} setCategories={setCategories} />;
      else if (view === "sla") content = <SLAManagement rules={slaRules} setRules={setSlaRules} />;
      else if (view === "profile") content = <Profile user={currentUser} onUpdate={updateProfile} />;

      return (
        <div style={{ fontFamily: FONT_BODY, background: COLORS.bg, minHeight: "100vh" }}>
          <Sidebar view={view} setView={(v) => { setView(v); setActiveTicketId(null); }} user={currentUser} onLogout={handleLogout} unread={unread} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen} />
          <div style={{ marginLeft: 226 }} className="hd-main">
            <div style={{ display: "none", alignItems: "center", padding: "12px 16px", borderBottom: `1px solid ${COLORS.line}`, background: "#fff" }} className="hd-topbar">
              <button onClick={() => setMobileOpen(true)} style={{ background: "none", border: "none", cursor: "pointer" }}><Menu size={20} /></button>
              <span style={{ fontFamily: FONT_DISPLAY, fontWeight: 700, marginLeft: 10 }}>HelpDeskOS</span>
            </div>
            <div style={{ padding: "28px 32px 60px", maxWidth: 1180 }}>
              {content}
            </div>
          </div>

          {showCreate && <CreateTicketModal onClose={() => setShowCreate(false)} onCreate={createTicket} categories={categories} currentUser={currentUser} />}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
